# 旅游票务平台通用配置。
# 敏感信息优先通过环境变量提供，不要把真实账号和密码提交到 Git。

spring:
  application:
    name: tourism-server

  # MySQL 数据源。启动前必须通过环境变量提供账号和密码。
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tourism_ticketing_platform}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池大小应结合数据库最大连接数和服务实例数调整。
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      pool-name: TourismHikariPool

  # 数据库版本管理，脚本放在 src/main/resources/db/migration。
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true

  # JSON 序列化统一采用中国时区，并忽略值为 null 的字段。
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

  mvc:
    # 启用 RFC 9457 Problem Details，便于统一返回接口错误。
    problemdetails:
      enabled: true

  lifecycle:
    # 收到停机信号后，最多等待正在处理的请求 30 秒。
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${REDIS_TIMEOUT:3s}

  kafka:
    # Kafka Broker 地址。本地开发默认使用 9092 端口。
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      # Kafka 的 Key 使用普通字符串。
      key-serializer: org.apache.kafka.common.serialization.StringSerializer

      # CouponClaimCommand 会被转换成 JSON。
      # 项目使用 Spring Boot 4，所以使用 JacksonJsonSerializer。
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

      # 消息需要获得当前所有同步副本的确认。
      acks: all

      properties:
        # 防止 Producer 因网络重试向同一分区写入重复消息。
        "[enable.idempotence]": true

    consumer:
      # Kafka Key 是 requestId 字符串。
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # Kafka Value 是 CouponClaimCommand JSON。
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer

      # 当前消费组第一次启动且没有 Offset 时，从最早的消息开始消费。
      auto-offset-reset: earliest

      # Offset 交给 Spring Kafka Listener 容器管理。
      enable-auto-commit: false

      properties:
        # Producer 发送的是 CouponClaimCommand。
        "[spring.json.value.default.type]": "com.qinghuan.coupon.message.CouponClaimCommand"

        # 只允许反序列化当前项目的消息包。
        "[spring.json.trusted.packages]": "com.qinghuan.coupon.message"

    listener:
      # 每处理完一条消息，再提交该条消息的 Offset。
      ack-mode: record

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 2KB
  error:
    # 生产环境不直接暴露异常、堆栈和参数校验细节。
    include-message: never
    include-stacktrace: never
    include-binding-errors: never


mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.qinghuan.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

logging:
  level:
    root: INFO
    com.qinghuan: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.flyway: DEBUG

  file:
    name: logs/tourism-server.log

  logback:
    rolling policy:
      file-name-pattern: logs/tourism-server.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# JWT 密钥必须是至少 32 字节随机值的 Base64 编码，示例：openssl rand -base64 32。
security:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: tourism-ticketing-platform
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:12h}
    excluded-paths:
      - /auth/login
      - /auth/register
      - /public/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /error

# 阿里云 OSS。默认值仅用于让本地项目正常启动，上传前必须通过环境变量替换。
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
    region: ${OSS_REGION:cn-hangzhou}
    access-key-id: ${OSS_ACCESS_KEY_ID:YOUR_OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:YOUR_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME:YOUR_OSS_BUCKET_NAME}
app:
  amap:
    # 高德 Web 服务地理编码接口。使用前需申请 Web 服务 Key。
    base-url: ${AMAP_BASE_URL:https://restapi.amap.com}
    key: ${AMAP_WEB_SERVICE_KEY:YOUR_AMAP_WEB_SERVICE_KEY}

  venue-geo:
    # 启动时根据 MySQL 中的启用景点重建 Redis GEO 索引。
    preload-enabled: ${VENUE_GEO_PRELOAD_ENABLED:true}

  venue-bloom:
    # 启动时把全部景点 ID 写入 Redis 布隆过滤器。
    preload-enabled: ${VENUE_BLOOM_PRELOAD_ENABLED:true}

  refund:
    # 当前使用 Redis 模拟第三方平台，真实接入时替换 RefundGateway 实现。
    gateway: ${REFUND_GATEWAY:simulated}
    pending-seconds: ${REFUND_PENDING_SECONDS:30}
    reconcile-cron: "${REFUND_RECONCILE_CRON:15 * * * * *}"

  coupon:
    claim-outbox:
      # 超过该时间仍未收到 Kafka 确认的消息由定时任务补发。
      pending-millis: ${COUPON_CLAIM_OUTBOX_PENDING_MILLIS:30000}
      fixed-delay-millis: ${COUPON_CLAIM_OUTBOX_FIXED_DELAY_MILLIS:10000}
      batch-size: ${COUPON_CLAIM_OUTBOX_BATCH_SIZE:100}

  canal:
    # 多实例部署时，只允许一个实例开启
    enabled: ${CANAL_ENABLED:true}

    host: ${CANAL_HOST:127.0.0.1}
    port: ${CANAL_PORT:11111}
    destination: ${CANAL_DESTINATION:example}

    # 这是 Canal Server 的 TCP 账号，不是 MySQL 账号。
    # Canal Server 没配置认证时可以留空。
    username: ${CANAL_USERNAME:}
    password: ${CANAL_PASSWORD:}

    database: ${DB_NAME:tourism_ticketing_platform}

    # 客户端再过滤一次，只接收相关表
    subscribe: '${CANAL_SUBSCRIBE:tourism_ticketing_platform\.(venue|admission_session|ticket_type|session_ticket_type)}'

    batch-size: 100
