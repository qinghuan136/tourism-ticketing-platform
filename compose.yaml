services:
  mysql:
    image: mysql:8.4
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tourism_ticketing_platform}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tourism_demo_password}
      MYSQL_ROOT_HOST: "%"
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  canal:
    image: canal/canal-server:v1.1.8
    environment:
      canal.auto.scan: "false"
      canal.destinations: example
      canal.instance.master.address: mysql:3306
      canal.instance.dbUsername: root
      canal.instance.dbPassword: ${MYSQL_ROOT_PASSWORD:-tourism_demo_password}
      canal.instance.connectionCharset: UTF-8
      canal.instance.gtidon: "false"
      canal.instance.filter.regex: "${MYSQL_DATABASE:-tourism_ticketing_platform}\\..*"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: tourism-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      # Nacos 3.x 的 Admin API 认证独立于客户端认证；本地演示允许初始化任务发布非敏感配置。
      NACOS_CORE_AUTH_ADMIN_ENABLED: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-tourism-nacos-key}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-tourism-nacos-value}

    ports:
      - "18080:8080"
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      # Nacos HTTP 健康端点会早于 gRPC 注册端口就绪；服务发现客户端还需要 9848。
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/ns/operator/metrics >/dev/null && nc -z -w 2 127.0.0.1 9848"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # 使用仓库内的非敏感配置初始化 Nacos；不需要在宿主机预先手工创建 DataId。
  nacos-config-init:
    image: nacos/nacos-server:v3.1.1
    entrypoint: ["/bin/sh", "/config/publish-nacos-config.sh"]
    environment:
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-TOURISM}
    volumes:
      - ./nacos-config:/config:ro
    depends_on:
      nacos:
        condition: service_healthy
    restart: "no"

  order-service:
    build:
      context: .
      dockerfile: docker/order-service.Dockerfile
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: demo
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-tourism_ticketing_platform}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tourism_demo_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dG91cmlzbS10aWNrZXRpbmctZGVtby1qd3Qtc2VjcmV0LTIwMjY=}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-TOURISM}
      SERVER_PORT: 8082
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
    volumes:
      - order_service_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: docker/user-service.Dockerfile
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-tourism_ticketing_platform}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tourism_demo_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dG91cmlzbS10aWNrZXRpbmctZGVtby1qd3Qtc2VjcmV0LTIwMjY=}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-TOURISM}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  venue-service:
    build:
      context: .
      dockerfile: docker/venue-service.Dockerfile
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-tourism_ticketing_platform}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tourism_demo_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dG91cmlzbS10aWNrZXRpbmctZGVtby1qd3Qtc2VjcmV0LTIwMjY=}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-TOURISM}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-YOUR_AMAP_WEB_SERVICE_KEY}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-hangzhou.aliyuncs.com}
      OSS_REGION: ${OSS_REGION:-cn-hangzhou}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-YOUR_OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-YOUR_OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-YOUR_OSS_BUCKET_NAME}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  coupon-service:
    build:
      context: .
      dockerfile: docker/coupon-service.Dockerfile
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-tourism_ticketing_platform}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tourism_demo_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dG91cmlzbS10aWNrZXRpbmctZGVtby1qd3Qtc2VjcmV0LTIwMjY=}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-TOURISM}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      TZ: Asia/Shanghai
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-TOURISM}
      JWT_SECRET: ${JWT_SECRET:-dG91cmlzbS10aWNrZXRpbmctZGVtby1qd3Qtc2VjcmV0LTIwMjY=}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      nacos:
        condition: service_healthy
      nacos-config-init:
        condition: service_completed_successfully
      order-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      venue-service:
        condition: service_healthy
      coupon-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  tourist-web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        APP_NAME: tourist
    ports:
      - "${TOURIST_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  operator-web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        APP_NAME: operator
    ports:
      - "${OPERATOR_PORT:-3001}:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  order_service_logs:
