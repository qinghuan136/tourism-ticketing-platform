# 旅游票务平台通用配置。
# 敏感信息优先通过环境变量提供，不要把真实账号和密码提交到 Git。

spring:
  application:
    name: order-service

  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: ${NACOS_CONFIG_GROUP:TOURISM}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 本机多网卡环境可通过 NACOS_DISCOVERY_IP 指定可被其他服务访问的注册地址。
        ip: ${NACOS_DISCOVERY_IP:}
    openfeign:
      micrometer:
        enabled: true

  # 本机专用配置放在仓库根目录 application-local.yml，已被 Git 忽略。
  config:
    import:
      - optional:file:./application-local.yml
      - optional:file:../application-local.yml
      - optional:nacos:order-service.yml?refreshEnabled=true

  # MySQL 数据源。账号和密码可由环境变量或本机配置文件提供。
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tourism_ticketing_platform}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:${local.db-password:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池大小应结合数据库最大连接数和服务实例数调整。
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      pool-name: TourismHikariPool

  # 数据库版本管理，脚本放在 src/main/resources/db/migration。
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true

  # JSON 序列化统一采用中国时区，并忽略值为 null 的字段。
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

  mvc:
    # 启用 RFC 9457 Problem Details，便于统一返回接口错误。
    problemdetails:
      enabled: true

  lifecycle:
    # 收到停机信号后，最多等待正在处理的请求 30 秒。
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${REDIS_TIMEOUT:3s}

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 2KB
  error:
    # 生产环境不直接暴露异常、堆栈和参数校验细节。
    include-message: never
    include-stacktrace: never
    include-binding-errors: never


mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.qinghuan.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

logging:
  file:
    name: logs/tourism-order-service.log

  logback:
    rolling policy:
      file-name-pattern: logs/tourism-order-service.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [${spring.application.name}] [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [${spring.application.name}] [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0

info:
  app:
    name: ${spring.application.name}

# 本地开发使用默认密钥；部署环境请通过 JWT_SECRET 覆盖为至少 32 字节的随机 Base64 密钥。
security:
  jwt:
    secret: ${JWT_SECRET:dG91cmlzbS10aWNrZXRpbmctZGVtby1qd3Qtc2VjcmV0LTIwMjY=}
    issuer: tourism-ticketing-platform
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:12h}
    excluded-paths:
      - /public/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /actuator/health
      - /error

internal:
  auth:
    token: ${INTERNAL_SERVICE_TOKEN:}
